name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A run on main that has started is never canceled, because it publishes the image of its commit.
# A group holds one waiting run, and a newer waiting run replaces it, so of the commits merged while a run is in progress only the newest gets an image.
# https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency — checked 2026-11-08
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The six mix jobs share setup steps; separate jobs keep each required check name stable and independently reportable.
jobs:
  compile:
    name: compile
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/cache@v6.1.0
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-
      - run: mix deps.get
      - run: mix compile --warnings-as-errors

  format:
    name: format
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/cache@v6.1.0
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-
      - run: mix deps.get
      - run: mix format --check-formatted

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/cache@v6.1.0
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-
      - run: mix deps.get
      - run: mix test

  assets:
    name: assets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/cache@v6.1.0
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-
      - run: mix deps.get
      - run: mix assets.setup
      - run: mix assets.build

  # The accessibility checks: the ExUnit rules of Gobusgo.Test.Accessibility over the rendered pages, html-eslint over the files that test writes, the node scan of the front end's JavaScript, and the visual checks of the stylesheet and the route chip rule.
  accessibility:
    name: accessibility
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: tools/lint/.node-version
      - uses: actions/cache@v6.1.0
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-
      - run: mix deps.get
      - run: npm ci --prefix tools/lint
      - run: npm run --prefix tools/lint check
      - run: mix test test/gobusgo_web/accessibility
      - run: node test/scripts/write_offline_screen.mjs
      - run: npm run --prefix tools/lint lint
      - run: node test/scripts/a11y_source_check.mjs
      - run: node test/scripts/css_accessibility_check.mjs
      - run: node test/scripts/route_chip_color_check.mjs

  # Checks that every repository path the AGENTS.md files name exists and that the root file's area map names every area file.
  agents-md:
    name: agents-md
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: tools/lint/.node-version
      - run: node test/scripts/agents_md_check.mjs

  # Lints priv/openapi.json and priv/openapi.private.json as JSON and against the OpenAPI 3.1 schema, after checking that the lint still reports the failures its fixtures hold.
  openapi:
    name: openapi
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: tools/lint/.node-version
      - run: npm ci --prefix tools/lint
      - run: npm run --prefix tools/lint check
      - run: npm run --prefix tools/lint lint:openapi

  image:
    name: image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: docker build --platform linux/arm64 --build-arg "GOBUSGO_REVISION=$GITHUB_SHA" --tag gobusgo:ci .
      # Starts the image as production would and checks that /health names the commit it was built from.
      - run: |
          docker run --detach --name gobusgo-ci --publish 127.0.0.1:4000:4000 \
            --env SECRET_KEY_BASE="$(openssl rand -hex 64)" \
            --env GOBUSGO_PUBLIC_HOST=localhost \
            gobusgo:ci
          for attempt in $(seq 1 60); do
            if body="$(curl --fail --silent --max-time 2 http://127.0.0.1:4000/health)"; then
              break
            fi
            sleep 1
          done
          echo "$body"
          test "$(jq --raw-output .revision <<< "$body")" = "$GITHUB_SHA"
      - if: failure()
        run: docker logs gobusgo-ci

  # Starts the image under production's memory limit against synthetic schedules of production's size, and fails when the container's anonymous memory passes the threshold of Gobusgo.StartMemory.
  start-memory:
    name: start-memory
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      # The runner's architecture is in the key, since the other mix jobs build for another one.
      - uses: actions/cache@v6.1.0
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.tool-versions') }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.tool-versions') }}-
      - run: mix deps.get
      - run: docker build --platform linux/arm64 --tag gobusgo:start-memory .
      - run: mix gobusgo.start_memory --image gobusgo:start-memory

  publish:
    name: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [compile, format, test, assets, accessibility, agents-md, openapi, image, start-memory]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$GITHUB_TOKEN"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # A run that is started again finds its commit's tag published and leaves it, because a second build has another digest.
      - id: published
        run: |
          if docker manifest inspect "$IMAGE" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      # The build attaches no provenance, so the tag names one image manifest and the package holds one version per commit.
      - if: steps.published.outputs.exists == 'false'
        run: |
          docker build \
            --platform linux/arm64 \
            --provenance=false \
            --build-arg "GOBUSGO_REVISION=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$IMAGE" \
            .
      - if: steps.published.outputs.exists == 'false'
        run: docker push "$IMAGE"
      - run: |
          digest="$(docker buildx imagetools inspect "$IMAGE" --format '{{.Manifest.Digest}}')"
          test -n "$digest"
          echo "Published \`$IMAGE\` with digest \`$digest\`." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/delete-package-versions@v5.0.0
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          min-versions-to-keep: 10

  # The job asks the infrastructure repository for a release of this commit and ends, so the outcome of the release is in that repository's runs alone.
  release:
    name: release
    # The repository variable is the pause: any value but true skips the job.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      API_VERSION: "2026-03-10"
      RELEASE_REPOSITORY: harrietfigueroa/gobusgo-infra
      RELEASE_WORKFLOW: application-release.yml
      REQUEST_SECONDS_MAX: 30
    steps:
      # A run that is started again after a later merge holds a commit behind the head of main, and a release of it moves production back.
      # https://docs.github.com/en/rest/commits/commits#get-a-commit — checked 2026-11-08
      - id: head
        run: |
          status="$(curl --silent --show-error --max-time "$REQUEST_SECONDS_MAX" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: $API_VERSION" \
            --output head.json \
            --write-out '%{http_code}' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/main")"
          if [[ "$status" != "200" ]]; then
            echo "::error::The head of main cannot be read: GitHub answered $status."
            exit 1
          fi
          head="$(jq --raw-output '.sha' head.json)"
          [[ "$head" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$head" == "$GITHUB_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "No release was asked for: \`$GITHUB_SHA\` is behind \`$head\`, the head of \`main\`." >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The request follows no redirect, so the token goes to the API's host alone.
      # A 200 carries the run that was started, and it is the one status the documentation gives.
      # https://docs.github.com/en/rest/actions/workflows#create-a-workflow-dispatch-event — checked 2026-11-08
      - if: steps.head.outputs.current == 'true'
        run: |
          if [[ -z "$RELEASE_TOKEN" ]]; then
            echo "::error::The secret PRODUCTION_RELEASE_TOKEN is empty."
            exit 1
          fi
          body="$(jq --null-input --compact-output --arg commit "$GITHUB_SHA" '{ref: "main", inputs: {commit: $commit}}')"
          status="$(curl --silent --show-error --max-time "$REQUEST_SECONDS_MAX" \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $RELEASE_TOKEN" \
            --header "Content-Type: application/json" \
            --header "X-GitHub-Api-Version: $API_VERSION" \
            --data "$body" \
            --output response.json \
            --write-out '%{http_code}' \
            "$GITHUB_API_URL/repos/$RELEASE_REPOSITORY/actions/workflows/$RELEASE_WORKFLOW/dispatches")"
          if [[ "$status" != "200" ]]; then
            message="$(jq --raw-output '.message // empty' response.json || true)"
            echo "::error::No release was started: $RELEASE_REPOSITORY answered $status to the request ($message). A 401 means the token in PRODUCTION_RELEASE_TOKEN has expired or was revoked, and a 403 or 404 that it lacks the Actions write permission on that repository."
            exit 1
          fi
          run_url="$(jq --raw-output '.html_url' response.json)"
          [[ "$run_url" == "$GITHUB_SERVER_URL/$RELEASE_REPOSITORY/actions/runs/"* ]]
          echo "Asked for a release of \`$GITHUB_SHA\`: $run_url" >> "$GITHUB_STEP_SUMMARY"
        env:
          RELEASE_TOKEN: ${{ secrets.PRODUCTION_RELEASE_TOKEN }}
