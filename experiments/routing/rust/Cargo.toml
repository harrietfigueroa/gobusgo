[package]
name = "routing-csa"
version = "0.1.0"
edition = "2021"
publish = false

# The WebAssembly connection scan engine of the routing experiment.
# It has no dependencies: the module exports plain functions over its linear
# memory, so its size is the engine's alone.
[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
